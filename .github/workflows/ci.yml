name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
    - name: Run Ruff formatting
      run: ruff format .
    - name: Run Ruff checks
      run: ruff check .
    - name: Run Mypy
      run: mypy telegram_agent

  # Render.com deployment is handled through Git integration