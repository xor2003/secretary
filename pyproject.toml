[project]
name = "Secretary"
version = "0.1.0"
description = "Messenger summarization agent for Telegram and Viber"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "xor2003", email = "xor2003@gmx.com" }
]
dependencies = [
    "telethon",
    "python-telegram-bot",
    "google",
    "google-genai",
    "google-api-python-client",
    "python-dotenv",
    "viber-bot",
    "imap-tools"
]

[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
ignore_missing_imports = true
